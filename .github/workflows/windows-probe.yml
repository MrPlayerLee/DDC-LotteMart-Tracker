name: Windows official store connectivity
on:
  push:
    branches: [verify/windows-lottemart-20261119]
    paths: [.github/workflows/windows-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 6
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Resolve official host and test TCP and TLS
        shell: bash
        run: |
          python - <<'PY'
          import socket, ssl
          host = 'company.lottemart.com'
          addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          for family, kind, proto, _, addr in addresses:
              print('DNS', addr[0], flush=True)
              with socket.socket(family, kind, proto) as sock:
                  sock.settimeout(8)
                  try:
                      sock.connect(addr)
                  except OSError as exc:
                      print('TCP 443 failed:', repr(exc))
                      continue
                  print('TCP 443 connected')
                  try:
                      with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as tls:
                          print('TLS', tls.version())
                  except OSError as exc:
                      print('TLS failed:', repr(exc))
          PY
      - name: Test HTTPS and record timing
        if: always()
        shell: bash
        run: |
          curl.exe -sS --connect-timeout 10 --max-time 20 -o NUL -w 'HTTP=%{http_code} DNS=%{time_namelookup} TCP=%{time_connect} TLS=%{time_appconnect}\n' https://company.lottemart.com/mobiledowa/
      - name: Query Dongducheon using the existing tracker
        if: always()
        run: python tracker.py --query "조니워커 레드" --status probe-status.json --latest probe-latest.json
