name: LotteMart stock and price tracking

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    paths:
      - "tracker.py"
      - "watchlist.json"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/track.yml"

permissions:
  contents: write

concurrency:
  group: lottemart-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ${{ vars.LOTTEMART_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Query official store service
        id: query
        continue-on-error: true
        run: python tracker.py
      - name: Save timestamped status to repository
        if: always() && steps.query.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # latest.json is created only after a successful lookup.
          # Stage whichever result files actually exist; preserve last successful result.
          git add -A -- data/status.json
          if [ -f data/latest.json ]; then
            git add -A -- data/latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update LotteMart lookup status [skip ci]"
            git push
          fi
      - name: Fail visibly if official site was inaccessible
        if: steps.query.outcome == 'failure'
        run: |
          echo "Official source unavailable; status.json contains the error."
          exit 1
