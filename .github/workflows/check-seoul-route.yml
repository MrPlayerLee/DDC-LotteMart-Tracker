name: Check Seoul cloud route
on:
  push:
    branches: [verify/free-cloud-egress-20261119]
    paths: [.github/workflows/check-seoul-route.yml]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Measure one official HTTPS product lookup
        run: |
          python -u - <<'PY'
          import requests,time,tracker
          from urllib.parse import urlencode
          api="https://api.globalping.io/v1/measurements"
          spec={"type":"http","target":"company.lottemart.com","locations":[{"country":"KR","asn":31898,"city":"Seoul"}],"limit":1,"measurementOptions":{"protocol":"HTTPS","request":{"method":"GET","path":tracker.PAGE_PATH,"query":urlencode({"p_market":"2435","p_schWord":"조니워커 레드","page":1})}}}
          r=requests.post(api,json=spec,timeout=20)
          print("Measurement creation",r.status_code,r.text[:400])
          r.raise_for_status()
          for _ in range(20):
              time.sleep(2)
              data=requests.get(api+"/"+r.json()["id"],timeout=15).json()
              if data.get("status")=="finished": break
          else: raise SystemExit("Measurement pending")
          entry=data["results"][0]
          v=entry["result"]
          tls=v.get("tls") or {}
          print("Probe",entry["probe"].get("network"),entry["probe"].get("city"),"DNS",v.get("resolvedAddress"),"timings_ms",v.get("timings"),"TLS",tls.get("protocol"),tls.get("authorized"),"HTTP",v.get("statusCode"))
          if not (tls.get("authorized") is True and v.get("statusCode")==200): raise SystemExit("No validated product response")
          rows=tracker.parse_products(v.get("rawBody") or "")
          print("Products",[(p["name"],p["spec"],p["price_krw"],p["stock_raw"],p["discount_status"]) for p in rows])
          if not rows: raise SystemExit("No product parsed")
          PY
